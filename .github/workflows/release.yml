name: release

on:
  push:
    tags:
      - "v*"
  # Manual trigger for exercising the pipeline without cutting a release.
  # On workflow_dispatch the GoReleaser step runs in snapshot/build mode
  # (no tag, no publish); only a tag push performs a real release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          # No go.sum in this dependency-free project; skip the module cache
          # to avoid the "Dependencies file is not found" warning.
          cache: false

      # Extract the section for the tag being released from CHANGELOG.md so the
      # hand-written changelog is the single source of truth for release notes.
      # The tag "vX.Y.Z" maps to the "## [X.Y.Z]" heading in the changelog.
      # Capture stops at the next version heading OR the link-reference block
      # (e.g. "[0.1.0]: https://...") so those definitions never leak into the
      # notes, regardless of where the section sits in the file.
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]"      { capture = 1; next }
            capture && /^## \[/           { exit }
            capture && /^\[[^]]+\]:[ \t]/ { exit }
            capture                       { lines[n++] = $0 }
            END {
              start = -1; end = -1
              for (i = 0; i < n; i++) {
                if (lines[i] ~ /[^[:space:]]/) { if (start < 0) start = i; end = i }
              }
              if (start < 0) exit
              for (i = start; i <= end; i++) print lines[i]
            }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::error::No CHANGELOG.md section found for version ${version}. Add a '## [${version}]' entry before tagging."
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
          echo "Extracted release notes for ${version}:"
          cat "$notes_file"

      # Real release: only on a v* tag push. Publishes archives + checksums
      # and uses the CHANGELOG-extracted notes.
      - name: Run GoReleaser (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes "${{ env.RELEASE_NOTES_FILE }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dry run: on manual dispatch, build a snapshot without tagging or
      # publishing, so the pipeline (toolchain, action versions, build config)
      # can be exercised on demand. Nothing is uploaded to GitHub Releases.
      - name: Run GoReleaser (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --snapshot --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
