version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: safari-data-tool
    binary: safari-data-tool
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: safari-data-tool
    ids:
      - safari-data-tool
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Release notes come from the hand-maintained CHANGELOG.md: the CI workflow
# extracts the section for the tag being released and passes it via
# `--release-notes`, which overrides GoReleaser's auto-generated changelog.
# Note: do NOT set `changelog.disable: true` here — in GoReleaser v2 that skips
# the pipe that applies `--release-notes`, which would leave the release body
# empty.
